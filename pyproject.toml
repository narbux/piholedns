[project]
name = "piholedns"
version = "0.2.0"
description = "This script is used to add CNAME entries to a pihole for DNS resolution."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["httpx2==2.16.0", "python-dotenv==1.2.4"]

[project.scripts]
piholedns = "piholedns.piholedns:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
